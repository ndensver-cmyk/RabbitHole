name: Build RabbitHole APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build clean debug APK
        run: gradle clean assembleDebug

      - name: Verify APK integrity, signature and package metadata
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee apk-metadata.txt
          grep -q "package: name='com.rabbithole.app' versionCode='25' versionName='1.0.26'" apk-metadata.txt
          sha256sum "$APK"

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RabbitHole-1.0.26.apk

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RabbitHole-1.0.26-verified
          path: RabbitHole-1.0.26.apk
          if-no-files-found: error

      - name: Publish verified APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0-26"
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RabbitHole 1.0.26 (APK verificado)" \
              --notes "APK compilado desde cero y verificado con ZIP integrity, apksigner y AAPT."
          fi
          gh release upload "$VERSION" RabbitHole-1.0.26.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
